<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Karnataka Tour – explore Hampi, Coorg, Mysuru, Gokarna and more.">
<title>Travel Blog | Karnataka Tour</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('kt_theme'))||'light'}catch(e){}</script>
</head><body><a href="#main" class="skip">Skip to content</a><noscript>Please enable JavaScript to use this site.</noscript><div id="site-header"></div><main id="main">
<div class="container page narrow" id="post" hidden></div>
<div class="container page" id="list-view"><h1>Travel Blog</h1><p class="muted">Read travel stories from Karnataka – or share your own below.</p>
<div class="search light"><span class="ico-s">🔍</span><input id="q" aria-label="Search articles" placeholder="Search articles"></div>
<div class="chips" id="chips"></div><div id="list"></div>

<section class="sec" id="write"><h2>✍️ Share Your Travel Story</h2>
<p class="muted">Posts are saved only in your browser (demo – nothing is uploaded). They appear in the list above straight away.</p>
<form class="card pad form post-form" id="post-form">
  <label>Your name<input id="pf-name" required maxlength="40" placeholder="e.g. Priya"></label>
  <label>Title<input id="pf-title" required maxlength="100" placeholder="e.g. A rainy weekend in Coorg"></label>
  <label>Category<select id="pf-cat"></select></label>
  <label>Cover image URL (optional)<input id="pf-img" type="url" placeholder="https://…"></label>
  <label>Your story<textarea id="pf-body" required rows="7" minlength="40" maxlength="5000" placeholder="Write at least a few sentences. Press Enter for a new paragraph."></textarea></label>
  <p class="hint" id="pf-count">0 / 5000</p>
  <button class="btn" type="submit">Publish post</button></form></section></div>
</main><div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
<script>
let q = '', cat = 'All';
const cats = blogCategories.filter((c) => c !== 'All');
$('#pf-cat').innerHTML = cats.map((c) => `<option>${c}</option>`).join('');
$('#chips').innerHTML = blogCategories.map((c) => `<button class="chip" data-c="${c}">${c}</button>`).join('');

function card(b) {
  const link = `blog.html?slug=${encodeURIComponent(b.slug)}`;
  return `<article class="card blog"><a href="${link}"><img loading="lazy" src="${esc(blogImg(b, 700, 420, 9))}" alt="${esc(b.title)}" onerror="fb(this)"></a>
    <div class="card-body"><span class="chip">${esc(b.category)}</span> ${b.user ? `<span class="chip user">${b.mine ? 'Your post' : 'Community post'}</span>` : ''}
    <h3><a href="${link}">${esc(b.title)}</a></h3><p class="clamp">${esc(b.excerpt)}</p>
    <small class="muted">by ${esc(b.author || 'Guest')} • ${b.date} • ${b.read} min</small>
    ${b.user && b.mine ? `<br><button class="btn sm danger" data-del="${esc(b.slug)}">Delete</button>` : ''}</div></article>`;
}
function render() {
  $$('#chips .chip').forEach((b) => { const on = b.dataset.c === cat; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
  const l = allBlogs().filter((b) => (cat === 'All' || b.category === cat) && (b.title + ' ' + b.excerpt).toLowerCase().includes(q.toLowerCase()));
  $('#list').innerHTML = l.length ? `<div class="grid">${l.map(card).join('')}</div>` : '<p class="empty">No articles found.</p>';
}
$('#q').addEventListener('input', (e) => { q = e.target.value; render(); });
$('#chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { cat = b.dataset.c; render(); } });
$('#list').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!confirm('Delete this post?')) return;
  const r = await api.del('/api/posts/' + encodeURIComponent(b.dataset.del));
  if (!r.ok) return toast(r.error);
  setUserPosts(userPosts().filter((p) => p.slug !== b.dataset.del)); render(); toast('Post deleted');
});
if (auth.current()) $('#pf-name').value = auth.current().name;
$('#pf-body').addEventListener('input', (e) => { $('#pf-count').textContent = `${e.target.value.length} / 5000`; });
$('#post-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = $('#pf-title').value.trim(), name = $('#pf-name').value.trim(), text = $('#pf-body').value.trim(), c = $('#pf-cat').value;
  const img = $('#pf-img').value.trim();
  if (!auth.current()) { toast('Please log in to publish your story'); setTimeout(() => { location.href = 'login.html?next=blog.html'; }, 900); return; }
  if (text.length < 40) return toast('Please write a little more (at least 40 characters)');
  if (img && !/^https?:\/\//i.test(img)) return toast('Image URL must start with http:// or https://');
  const r = await api.post('/api/posts', { author: name, title, category: c, img, body: text });
  if (!r.ok) return toast(r.error);
  setUserPosts([r.post, ...userPosts()]);
  e.target.reset(); $('#pf-name').value = auth.current().name; $('#pf-count').textContent = '0 / 5000'; q = ''; $('#q').value = ''; cat = 'All'; render();
  toast('Your post is published ✓');
  $('#list').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
/* ---------- detail view (same file): blog.html?slug=... ---------- */
function showPost(slug) {
  const b = allBlogs().find((x) => x.slug === slug);
  $('#list-view').hidden = true; $('#post').hidden = false; window.scrollTo(0, 0);
  if (!b) { $('#post').innerHTML = '<div class="center"><h1 class="big404">404</h1><h2>Article not found</h2><a class="btn" href="blog.html">Back to blog</a></div>'; return; }
  document.title = b.title + ' | Karnataka Tour';
  $('#post').innerHTML = `<a href="blog.html" class="link">← Back to blog</a><br><span class="chip">${esc(b.category)}</span> ${b.user ? '<span class="chip user">Community post</span>' : ''}
    <h1>${esc(b.title)}</h1><p class="muted">by ${esc(b.author || 'Guest')} • ${b.date} • ${b.read} min read</p>
    <img class="banner" src="${esc(blogImg(b, 1200, 600, 4))}" alt="${esc(b.title)}" onerror="fb(this)">${b.body.map((p) => `<p class="lead">${esc(p)}</p>`).join('')}
    <h3>More to read</h3><ul class="ticks">${allBlogs().filter((x) => x.slug !== b.slug).slice(0, 4).map((m) => `<li><a class="link" href="blog.html?slug=${encodeURIComponent(m.slug)}">${esc(m.title)}</a></li>`).join('')}</ul>`;
}
const wantSlug = new URLSearchParams(location.search).get('slug');
if (wantSlug) showPost(wantSlug); else render();
</script></body></html>

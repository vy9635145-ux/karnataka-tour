<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Login | Karnataka Tour</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("kt_theme"))||"light"}catch(e){}</script>
</head><body><a href="#main" class="skip">Skip to content</a><noscript>Please enable JavaScript to use this site.</noscript><div id="site-header"></div><main id="main">
<div class="auth">
  <aside class="auth-side"><h2>ಮರಳಿ ಸ್ವಾಗತ! Welcome back</h2><p>Log in to see your saved places and continue planning your Karnataka trip.</p><p style="opacity:.85">Hegiddira? 😊</p></aside>
  <div class="auth-main"><div class="card pad auth-card">
    <div id="p-login"><h1>Log in</h1><p class="muted">New here? <a class="link" href="signup.html">Create an account</a></p>
      <form class="form" id="lf" novalidate>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<span class="pw"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" aria-label="Show password">👁️</button></span></label>
        <div class="row between"><label class="check"><input type="checkbox" name="remember" checked> <span>Remember me</span></label><a href="#" class="link" id="to-forgot">Forgot password?</a></div>
        <p class="form-msg" id="msg" role="alert"></p><button class="btn block" type="submit" id="go">Log in</button></form></div>
    <div id="p-forgot" hidden><h1>Reset password</h1><p class="muted">Enter your email to get a 6-digit code. <a class="link" href="#" id="to-login">Back to login</a></p>
      <form class="form" id="ff" novalidate>
        <label>Email<input name="email" type="email" required></label>
        <div id="step2" hidden><div class="otp" id="otp"></div>
          <label>6-digit code<input name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
          <label>New password<span class="pw"><input name="password" type="password" autocomplete="new-password" minlength="8"><button type="button" class="eye" aria-label="Show password">👁️</button></span></label></div>
        <p class="form-msg" id="fmsg" role="alert"></p><button class="btn block" type="submit" id="fgo">Send code</button></form></div>
  </div></div></div>
</main><div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
<script>
const next = new URLSearchParams(location.search).get('next');
const safeNext = /^[a-z0-9\-]+\.html(\?[\w=&%\-]*)?$/i.test(next || '') ? next : 'profile.html';
if (auth.current()) location.replace(safeNext);
const show = (id) => { ['p-login', 'p-forgot'].forEach((x) => { $('#' + x).hidden = x !== id; }); };
$('#to-forgot').addEventListener('click', (e) => { e.preventDefault(); show('p-forgot'); });
$('#to-login').addEventListener('click', (e) => { e.preventDefault(); show('p-login'); });
$$('.eye').forEach((b) => b.addEventListener('click', () => { const i = b.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; }));
$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#msg').textContent = ''; const d = Object.fromEntries(new FormData(e.target));
  if (!d.email || !d.password) { $('#msg').textContent = 'Please enter email and password.'; return; }
  $('#go').disabled = true; const r = await auth.login({ email: d.email, password: d.password, remember: !!d.remember }); $('#go').disabled = false;
  if (!r.ok) { $('#msg').textContent = r.error; return; }
  toast('Welcome back, ' + r.user.name.split(' ')[0] + '! 👋'); setTimeout(() => { location.href = safeNext; }, 600);
});
let stage = 1;
$('#ff').addEventListener('submit', async (e) => {
  e.preventDefault(); const fm = $('#fmsg'); fm.className = 'form-msg'; fm.textContent = ''; const d = Object.fromEntries(new FormData(e.target));
  if (stage === 1) {
    const r = await auth.requestReset(d.email); if (!r.ok) { fm.textContent = r.error; return; }
    $('#step2').hidden = false; stage = 2; $('#fgo').textContent = 'Reset password';
    $('#otp').textContent = r.code ? 'Development mode – your code is: ' + r.code : 'If this email is registered, a 6-digit code has been sent to it. It expires in 10 minutes.';
    return;
  }
  const r = await auth.resetPassword(d.email, d.code, d.password);
  if (!r.ok) { fm.textContent = r.error; return; }
  fm.className = 'form-msg ok'; fm.textContent = 'Password updated. You can log in now.'; setTimeout(() => { show('p-login'); stage = 1; }, 1200);
});
</script></body></html>
